<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis + WebSocket Chat Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        .msg {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .my-msg {
            color: blue;
        }

        .server-msg {
            color: green;
        }

        input[type="text"] {
            width: 75%;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Live Chat Test</h2>
    <div id="status" style="color: red; font-weight: bold; margin-bottom: 10px;">Disconnected</div>

    <div id="messages"></div>

    <form id="chat-form">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>

    <!-- Load Socket.io Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const BACKEND_URL = "https://n8n-host-ws-server.arwjwc.easypanel.host";

        // Prompt user for a username upon opening the page
        let username = prompt("Enter your username:") || "Anonymous";

        const socket = io(BACKEND_URL, {
            transports: ["websocket"]
        });

        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');

        // Helper function to render messages
        function appendMessage(sender, content, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = `${sender}: ${content}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Connection Events
        socket.on('connect', () => {
            statusDiv.textContent = `Connected as ${username} (ID: ${socket.id})`;
            statusDiv.style.color = "green";
        });

        socket.on('disconnect', () => {
            statusDiv.textContent = "Disconnected";
            statusDiv.style.color = "red";
        });

        // Load past messages from PostgreSQL upon connection
        socket.on('init_history', (history) => {
            history.forEach(msg => {
                const className = msg.sender === username ? 'my-msg' : 'server-msg';
                appendMessage(msg.sender, msg.content, className);
            });
        });

        // Listen for incoming messages from other users via Redis/Backend broadcast
        socket.on('chat_message', ({ sender, content }) => {
            appendMessage(sender, content, 'server-msg');
        });

        // Send messages to the backend
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const content = msgInput.value;

            // Emit object containing sender and content
            socket.emit('chat_message', { sender: username, content });

            // Display locally for the sender
            appendMessage(username, content, 'my-msg');

            msgInput.value = '';
        });
    </script>
</body>

</html>
