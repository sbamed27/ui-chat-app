<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis + WebSocket Private Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            max-width: 800px;
            margin: 20px auto;
            gap: 20px;
        }

        #sidebar {
            width: 250px;
            border-right: 1px solid #ccc;
            padding-right: 10px;
        }

        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .user-item:hover {
            background: #f0f0f0;
        }

        .user-item.active {
            background: #e0e0e0;
            font-weight: bold;
        }

        .msg {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .my-msg {
            color: blue;
        }

        .peer-msg {
            color: green;
        }

        input[type="text"] {
            width: 75%;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h3>Users Online</h3>
        <div id="user-list"></div>
    </div>

    <div id="chat-container">
        <h2 id="chat-title">Select a user to chat</h2>
        <div id="status" style="color: red; font-weight: bold; margin-bottom: 10px;">Disconnected</div>
        <div id="messages"></div>
        <form id="chat-form" style="display: none;">
            <input type="text" id="msg-input" placeholder="Type a private message..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const BACKEND_URL = "https://n8n-host-ws-server.arwjwc.easypanel.host";
        let username = prompt("Enter your username:") || "Anonymous";
        let activeRecipient = null;

        const socket = io(BACKEND_URL, { transports: ["websocket"] });

        const statusDiv = document.getElementById('status');
        const userListDiv = document.getElementById('user-list');
        const chatTitle = document.getElementById('chat-title');
        const messagesDiv = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');

        socket.on('connect', () => {
            statusDiv.textContent = `Connected as ${username}`;
            statusDiv.style.color = "green";

            // Register user and get list of peers
            socket.emit('register_user', username, (response) => {
                if (response.success) {
                    renderUserList(response.users);
                }
            });
        });

        function renderUserList(users) {
            userListDiv.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.textContent = user;
                div.onclick = () => selectUser(user, div);
                userListDiv.appendChild(div);
            });
        }

        function selectUser(user, element) {
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            activeRecipient = user;
            chatTitle.textContent = `Chat with ${user}`;
            messagesDiv.innerHTML = '';
            chatForm.style.display = 'block';

            // Join private room and fetch history
            socket.emit('join_private_chat', { recipient: user }, (response) => {
                if (response.success) {
                    response.history.forEach(msg => {
                        const className = msg.sender === username ? 'my-msg' : 'peer-msg';
                        appendMessage(msg.sender, msg.content, className);
                    });
                }
            });
        }

        function appendMessage(sender, content, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.textContent = `${sender}: ${content}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Listen for incoming private messages
        socket.on('private_message', ({ sender, content }) => {
            if (activeRecipient === sender) {
                appendMessage(sender, content, 'peer-msg');
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!activeRecipient) return;
            const content = msgInput.value;

            socket.emit('private_message', { recipient: activeRecipient, content });
            appendMessage(username, content, 'my-msg');
            msgInput.value = '';
        });
    </script>
</body>

</html>
