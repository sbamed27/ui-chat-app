<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure JWT WebSocket Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 920px;
            margin: 30px auto;
            background: #f8fafc;
            color: #1e293b;
            padding: 0 16px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        #auth-screen {
            max-width: 400px;
            margin: 60px auto;
        }

        #chat-screen {
            display: none;
            height: 560px;
            gap: 20px;
        }

        #sidebar {
            width: 260px;
            border-right: 1px solid #f1f5f9;
            padding-right: 18px;
            display: flex;
            flex-direction: column;
        }

        #user-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .user-item:hover {
            background: #f1f5f9;
            transform: translateX(2px);
        }

        .user-item.active {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
            font-weight: 600;
        }

        #chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #messages {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow-y: auto;
            padding: 14px;
            margin-bottom: 6px;
            background: #fcfdfe;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 8px 14px;
            border-radius: 14px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .my-msg {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            margin-left: auto;
            text-align: right;
            border-bottom-right-radius: 4px;
        }

        .peer-msg {
            background: #f1f5f9;
            color: #1e293b;
            margin-right: auto;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        /* Animated Typing Indicator Styles */
        .typing-indicator {
            display: flex;
            align-items: center;
            height: 0;
            opacity: 0;
            overflow: hidden;
            padding: 0 8px;
            margin-bottom: 0;
            transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        margin-bottom 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .typing-indicator.visible {
            height: 32px;
            opacity: 1;
            margin-bottom: 8px;
            pointer-events: auto;
        }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 5px 12px;
            font-size: 12px;
            color: #64748b;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            animation: fadeInIndicator 0.2s ease-out;
        }

        .typing-name {
            font-weight: 600;
            color: #2563eb;
        }

        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 3.5px;
            margin-left: 2px;
        }

        .typing-dots .dot {
            width: 5px;
            height: 5px;
            background-color: #2563eb;
            border-radius: 50%;
            display: inline-block;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dots .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dots .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .typing-dots .dot:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes typingBounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        @keyframes fadeInIndicator {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input,
        button {
            padding: 11px 14px;
            margin-top: 8px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        #logout-btn {
            background: #ef4444;
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        #logout-btn:hover {
            background: #dc2626;
        }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .status-dot {
            height: 9px;
            width: 9px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .online {
            background-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .offline {
            background-color: #cbd5e1;
        }
    </style>
</head>

<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="card">
        <h2 id="auth-title" style="margin-top:0; text-align:center; font-size: 22px;">Sign In</h2>
        <form id="auth-form">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="auth-btn">Sign In</button>
        </form>
        <div class="toggle-link" id="toggle-mode">Need an account? Sign Up</div>
        <div id="auth-error" style="color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center;"></div>
    </div>

    <!-- CHAT APPLICATION SCREEN -->
    <div id="chat-screen" class="card" style="display:none; display:flex;">
        <div id="sidebar">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="current-user-label" style="margin:0; font-size: 15px; font-weight: 600;"></h3>
                <button id="logout-btn" style="width: auto; margin:0;">Logout</button>
            </div>
            <hr style="border:0; border-top:1px solid #e2e8f0; margin: 12px 0;">
            <div style="font-weight: 600; font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Contacts</div>
            <div id="user-list"></div>
        </div>
        <div id="chat-main">
            <h3 id="chat-header"
                style="margin-top:0; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; font-size: 16px; font-weight: 600;">Select a
                contact</h3>
            <div id="messages"></div>

            <!-- ANIMATED TYPING INDICATOR -->
            <div id="typing-indicator" class="typing-indicator">
                <div class="typing-bubble">
                    <span class="typing-name" id="typing-user">Someone</span>
                    <span>is typing</span>
                    <div class="typing-dots">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </div>

            <form id="chat-form" style="display:none; display:flex; gap: 8px; margin:0;">
                <input type="text" id="msg-input" placeholder="Type a private message..." autocomplete="off" required
                    style="margin:0;">
                <button type="submit" style="width: 100px; margin:0;">Send</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const BACKEND_URL = "https://n8n-host-ws-server.arwjwc.easypanel.host";

        let isSignupMode = false;
        let socket = null;
        let activeRecipient = null;
        let activeRecipientId = null;
        let currentUsername = localStorage.getItem('chat_username');
        let token = localStorage.getItem('chat_token');
        let usersCache = []; // Cache for user list & presence statuses

        // Typing detection state
        let isTyping = false;
        let typingDebounceTimer = null;
        const TYPING_IDLE_TIMEOUT_MS = 1800; // Idle duration before auto-sending typing_stop

        // Peer typing indicator state
        let peerTypingTimeout = null;
        const PEER_TYPING_AUTO_HIDE_MS = 3500; // Auto-hide indicator if typing_stop missed

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const toggleMode = document.getElementById('toggle-mode');
        const authError = document.getElementById('auth-error');

        const userListDiv = document.getElementById('user-list');
        const currentUserLabel = document.getElementById('current-user-label');
        const chatHeader = document.getElementById('chat-header');
        const messagesDiv = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const logoutBtn = document.getElementById('logout-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const typingUserLabel = document.getElementById('typing-user');

        // Toggle between Sign In and Sign Up views
        toggleMode.onclick = () => {
            isSignupMode = !isSignupMode;
            authTitle.textContent = isSignupMode ? 'Sign Up' : 'Sign In';
            authBtn.textContent = isSignupMode ? 'Create Account' : 'Sign In';
            toggleMode.textContent = isSignupMode ? 'Already have an account? Sign In' : "Need an account? Sign Up";
            authError.textContent = '';
        };

        // Handle Signup / Signin submission
        authForm.onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const endpoint = isSignupMode ? '/api/signup' : '/api/signin';

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Authentication failed');

                // Save credentials in browser storage
                localStorage.setItem('chat_token', data.token);
                localStorage.setItem('chat_username', data.username);
                token = data.token;
                currentUsername = data.username;

                initChatApp();
            } catch (err) {
                authError.textContent = err.message;
            }
        };

        // Helper to retrieve active recipient's numeric ID
        function getActiveRecipientId() {
            if (activeRecipientId) return activeRecipientId;
            const found = usersCache.find(u => u.username === activeRecipient);
            return found ? found.id : null;
        }

        // 1 & 2: Detect typing on frontend with debounce timer and emit typing_start / typing_stop
        function handleTypingInput() {
            if (!socket || !activeRecipient) return;

            const content = msgInput.value.trim();
            const recipientId = getActiveRecipientId();

            // Clear input: immediately emit stop
            if (content.length === 0) {
                if (isTyping) {
                    stopTyping();
                }
                return;
            }

            // Start typing: emit typing_start
            if (!isTyping) {
                isTyping = true;
                socket.emit('typing_start', {
                    recipientId,
                    recipient: activeRecipient
                });
            }

            // Debounce timer: reset countdown on every keystroke
            clearTimeout(typingDebounceTimer);
            typingDebounceTimer = setTimeout(() => {
                stopTyping();
            }, TYPING_IDLE_TIMEOUT_MS);
        }

        function stopTyping() {
            if (!isTyping) return;
            isTyping = false;
            clearTimeout(typingDebounceTimer);

            if (socket && (activeRecipient || activeRecipientId)) {
                const recipientId = getActiveRecipientId();
                socket.emit('typing_stop', {
                    recipientId,
                    recipient: activeRecipient
                });
            }
        }

        // 4: Show and hide UI animated indicator
        function showTypingIndicator(senderUsername) {
            if (typingUserLabel) {
                typingUserLabel.textContent = senderUsername;
            }
            if (typingIndicator) {
                typingIndicator.classList.add('visible');
            }

            // Auto-scroll messages container if user is already near bottom
            const isNearBottom = messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 120;
            if (isNearBottom) {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // Auto-hide fallback after timeout
            clearTimeout(peerTypingTimeout);
            peerTypingTimeout = setTimeout(() => {
                hideTypingIndicator();
            }, PEER_TYPING_AUTO_HIDE_MS);
        }

        function hideTypingIndicator() {
            clearTimeout(peerTypingTimeout);
            if (typingIndicator) {
                typingIndicator.classList.remove('visible');
            }
        }

        // Input listeners for typing detection
        msgInput.addEventListener('input', handleTypingInput);

        // Logout functionality
        logoutBtn.onclick = () => {
            stopTyping();
            hideTypingIndicator();
            localStorage.clear();
            if (socket) socket.disconnect();
            chatScreen.style.display = 'none';
            authScreen.style.display = 'block';
            document.getElementById('password').value = '';
            activeRecipient = null;
            activeRecipientId = null;
        };

        // Auto-login if token already exists in browser storage
        if (token && currentUsername) {
            initChatApp();
        }

        function initChatApp() {
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            currentUserLabel.textContent = `User: ${currentUsername}`;

            // Initialize Socket.io connection, passing JWT in auth handshake
            socket = io(BACKEND_URL, {
                auth: { token },
                transports: ["websocket"]
            });

            socket.on('connect_error', (err) => {
                authError.textContent = "Session expired. Please log in again.";
                logoutBtn.click();
            });

            // Receive full initial user list with online status & IDs
            socket.on('user_list', (users) => {
                usersCache = users;
                renderUserList(usersCache);
                if (activeRecipient) {
                    const current = usersCache.find(u => u.username === activeRecipient);
                    if (current) activeRecipientId = current.id;
                }
            });

            // Listen for live status toggles from Redis/Socket broadcast
            socket.on('user_status', ({ id, username, isOnline }) => {
                const user = usersCache.find(u => u.username === username || (id && u.id === id));
                if (user) {
                    user.isOnline = isOnline;
                    if (id && !user.id) user.id = id;
                    renderUserList(usersCache);
                }
            });

            // Listen for incoming private messages
            socket.on('private_message', ({ sender, senderId, content }) => {
                if (activeRecipient === sender || (activeRecipientId && activeRecipientId === senderId)) {
                    hideTypingIndicator(); // Recipient got the message, stop typing indicator
                    appendMessage(sender, content, 'peer-msg');
                }
            });

            // 4: Recipient browser listens for typing events
            socket.on('typing_start', ({ sender, senderId }) => {
                if (activeRecipient === sender || (activeRecipientId && activeRecipientId === senderId)) {
                    showTypingIndicator(sender);
                }
            });

            socket.on('typing_stop', ({ sender, senderId }) => {
                if (activeRecipient === sender || (activeRecipientId && activeRecipientId === senderId)) {
                    hideTypingIndicator();
                }
            });
        }

        function renderUserList(users) {
            userListDiv.innerHTML = '';
            if (users.length === 0) {
                userListDiv.innerHTML = '<div style="color:#94a3b8; font-size:13px; padding:10px;">No other users</div>';
                return;
            }
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = `user-item ${activeRecipient === user.username ? 'active' : ''}`;

                const dot = document.createElement('span');
                dot.className = `status-dot ${user.isOnline ? 'online' : 'offline'}`;

                const nameSpan = document.createElement('span');
                nameSpan.textContent = user.username;

                div.appendChild(dot);
                div.appendChild(nameSpan);

                div.onclick = () => selectRecipient(user, div);
                userListDiv.appendChild(div);
            });
        }

        function selectRecipient(user, element) {
            stopTyping();

            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            activeRecipient = typeof user === 'string' ? user : user.username;
            activeRecipientId = typeof user === 'object' && user ? user.id : null;

            chatHeader.textContent = `Chat with ${activeRecipient}`;
            messagesDiv.innerHTML = '';
            hideTypingIndicator();
            chatForm.style.display = 'flex';
            msgInput.focus();

            socket.emit('join_private_chat', { recipient: activeRecipient, recipientId: activeRecipientId }, (res) => {
                if (res.success) {
                    if (res.recipientId) activeRecipientId = res.recipientId;
                    res.history.forEach(msg => {
                        const className = msg.sender === currentUsername ? 'my-msg' : 'peer-msg';
                        appendMessage(msg.sender, msg.content, className);
                    });
                }
            });
        }

        function appendMessage(sender, content, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = `<strong>${sender}:</strong> ${content}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            if (!activeRecipient) return;
            const content = msgInput.value.trim();
            if (!content) return;

            stopTyping();

            const recipientId = getActiveRecipientId();
            socket.emit('private_message', { recipient: activeRecipient, recipientId, content });
            appendMessage(currentUsername, content, 'my-msg');
            msgInput.value = '';
        };
    </script>
</body>

</html>
